services:
  redis:
    image: redis:7
    container_name: aivuln-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    image: aivuln-backend:local
    container_name: aivuln-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
      - iam-db-collector
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/ssh:/opt/ssh:ro
      - ./controls:/app/controls:ro
      - ./framework_mappings:/app/framework_mappings:ro
      - ./inventory:/app/inventory:ro
      - /var/lib/ai-vulnerability-management/evidence:/app/evidence
      - /var/lib/ai-vulnerability-management/job-output:/app/job-output
      - /var/lib/ai-vulnerability-management/remote-cache:/app/remote-cache
      - /var/log/ai-vulnerability-management:/app/logs
      - /home/aivuln/.ssh:/home/aivuln/.ssh:ro
      - /var/lib/ai-vulnerability-management:/var/lib/ai-vulnerability-management
    ports:
      - "0.0.0.0:8000:8000"

  iam-db-collector:
    build:
      context: ./iam-db-collector
    image: aivuln-iam-db-collector:local
    container_name: aivuln-iam-db-collector
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DASHBOARD_INGEST_URL: http://backend:8000/api/iam/db-ingest
      IAM_DB_SOURCES_FILE: /app/config/sources.json
      IAM_COLLECTOR_POLL_SECONDS: "30"
    volumes:
      - ./iam-db-collector/config:/app/config:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./backend
    image: aivuln-backend:local
    container_name: aivuln-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
    command: ["python", "-m", "app.worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./controls:/app/controls:ro
      - ./framework_mappings:/app/framework_mappings:ro
      - ./inventory:/app/inventory:ro
      - /var/lib/ai-vulnerability-management/evidence:/app/evidence
      - /var/lib/ai-vulnerability-management/job-output:/app/job-output
      - /var/lib/ai-vulnerability-management/remote-cache:/app/remote-cache
      - /var/log/ai-vulnerability-management:/app/logs
      - /home/aivuln/.ssh:/home/aivuln/.ssh:ro
      - /var/lib/ai-vulnerability-management:/var/lib/ai-vulnerability-management

  frontend:
    build:
      context: ./frontend
    image: aivuln-frontend:local
    container_name: aivuln-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://192.168.1.246:8000
    ports:
      - "0.0.0.0:3000:80"

volumes:
  redis_data:

networks:
  default:
    name: aivuln-net
    external: true
